# GitHub revisa cada semana las librerías y abre un pull request cuando hay
# actualizaciones. "npm" también cubre proyectos con pnpm (lee pnpm-lock.yaml).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    # Espera unos días antes de proponer una versión nueva: si alguien publica una versión
    # maliciosa, suele detectarse y retirarse en ese tiempo. También evita que pnpm la
    # rechace por su propia espera mínima (minimumReleaseAge).
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Actualizaciones menores y parches juntos en un solo pull request.
      menores:
        update-types: ["minor", "patch"]
